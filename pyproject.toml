[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strictspec"
version = "0.2.0"
description = "Zero-extra-VRAM structural speculative decoding for fast code generation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "llama-cpp-python>=0.2.80",
  "numpy>=1.24",
  "rich>=13.0.0",
]
authors = [
  { name = "StructSpec contributors" }
]
keywords = [
  "speculative-decoding",
  "llm-inference",
  "qwen",
  "llama-cpp",
  "structured-generation",
  "code-generation",
  "acceleration",
  "transformers",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "black",
  "ruff",
  "mypy",
]
viz = [
  "matplotlib>=3.7",
]
all = [
  "pytest>=7.0",
  "black",
  "ruff",
  "mypy",
  "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/neerajanand/strictspec"
Repository = "https://github.com/neerajanand/strictspec"
Issues = "https://github.com/neerajanand/strictspec/issues"
Changelog = "https://github.com/neerajanand/strictspec/releases"

[project.scripts]
structspec-qwen = "structspec_qwen.cli:main"
strictspec = "structspec_qwen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
